<div class="table-container">
  <h2>Liste des Terrains</h2>
  
  <p *ngIf="loading" class="loading">Chargement des terrains...</p>
  
  <p *ngIf="error" class="error">{{ error }}</p>
  
  <p *ngIf="!loading && terrains.length === 0 && !error" class="no-data">Aucun terrain trouvé</p>
  
  <table *ngIf="!loading && terrains.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Description</th>
          <th>Quantité</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let terrain of terrains">
          <td>{{ terrain.id }}</td>

          <td *ngIf="editingId !== terrain.id">{{ terrain.nom }}</td>
          <td *ngIf="editingId === terrain.id"><input [(ngModel)]="editing!.nom" name="nom-{{ terrain.id }}" /></td>

          <td *ngIf="editingId !== terrain.id">{{ terrain.description }}</td>
          <td *ngIf="editingId === terrain.id"><input [(ngModel)]="editing!.description" name="desc-{{ terrain.id }}" /></td>

          <td *ngIf="editingId !== terrain.id">{{ terrain.quantite }}</td>
          <td *ngIf="editingId === terrain.id"><input type="number" [(ngModel)]="editing!.quantite" name="quant-{{ terrain.id }}" /></td>

          <td *ngIf="editingId !== terrain.id">{{ terrain.coordonnees.latitude }}</td>
          <td *ngIf="editingId === terrain.id"><input [(ngModel)]="editing!.coordonnees.latitude" name="lat-{{ terrain.id }}" /></td>

          <td *ngIf="editingId !== terrain.id">{{ terrain.coordonnees.longitude }}</td>
          <td *ngIf="editingId === terrain.id"><input [(ngModel)]="editing!.coordonnees.longitude" name="long-{{ terrain.id }}" /></td>

          <td>
            <button *ngIf="auth.isAdmin() && editingId !== terrain.id" class="edit-btn" (click)="startEdit(terrain)">Modifier</button>
            <button *ngIf="auth.isAdmin() && editingId === terrain.id" class="save-btn" (click)="saveEdit(terrain.id)">Enregistrer</button>
            <button *ngIf="auth.isAdmin() && editingId === terrain.id" class="cancel-btn" (click)="cancelEdit()">Annuler</button>
            <button *ngIf="auth.isAdmin()" class="delete-btn" (click)="deleteTerrain(terrain.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>    
</div>
