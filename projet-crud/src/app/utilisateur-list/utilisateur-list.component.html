<div class="table-container">
  <h2>Liste des Utilisateurs</h2>
  
  <p *ngIf="loading" class="loading">Chargement des utilisateurs...</p>
  
  <p *ngIf="error" class="error">{{ error }}</p>
  
  <p *ngIf="!loading && utilisateurs.length === 0 && !error" class="no-data">Aucun utilisateur trouvé</p>
  
  <table *ngIf="!loading && utilisateurs.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Nom d'utilisateur</th>
          <th>Rôle</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let utilisateur of utilisateurs">
          <td>{{ utilisateur.id }}</td>

          <td *ngIf="editingId !== utilisateur.id">{{ utilisateur.nom }}</td>
          <td *ngIf="editingId === utilisateur.id"><input [(ngModel)]="editing!.nom" name="nom-{{ utilisateur.id }}" /></td>

          <td *ngIf="editingId !== utilisateur.id">{{ utilisateur.prenom }}</td>
          <td *ngIf="editingId === utilisateur.id"><input [(ngModel)]="editing!.prenom" name="prenom-{{ utilisateur.id }}" /></td>

          <td *ngIf="editingId !== utilisateur.id">{{ utilisateur.mail }}</td>
          <td *ngIf="editingId === utilisateur.id"><input [(ngModel)]="editing!.mail" name="mail-{{ utilisateur.id }}" /></td>

          <td *ngIf="editingId !== utilisateur.id">{{ utilisateur.username }}</td>
          <td *ngIf="editingId === utilisateur.id"><input [(ngModel)]="editing!.username" name="user-{{ utilisateur.id }}" /></td>

          <td *ngIf="editingId !== utilisateur.id">{{ utilisateur.role }}</td>
          <td *ngIf="editingId === utilisateur.id"><input [(ngModel)]="editing!.role" name="role-{{ utilisateur.id }}" /></td>

          <td>
            <button *ngIf="auth.isAdmin() && editingId !== utilisateur.id" class="edit-btn" (click)="startEdit(utilisateur)">Modifier</button>
            <button *ngIf="auth.isAdmin() && editingId === utilisateur.id" class="save-btn" (click)="saveEdit(utilisateur.id)">Enregistrer</button>
            <button *ngIf="auth.isAdmin() && editingId === utilisateur.id" class="cancel-btn" (click)="cancelEdit()">Annuler</button>
            <button *ngIf="auth.isAdmin()" class="delete-btn" (click)="deleteUtilisateur(utilisateur.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>    
</div>
