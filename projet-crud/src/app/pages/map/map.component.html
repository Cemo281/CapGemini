<header class="hero">
  <div class="container">
    <div class="brand">
      <h1>PolyGEMIMI</h1>
      <p class="subtitle">Gestion des terrains, coordonnées et utilisateurs</p>
    </div>

    <nav class="main-nav">
      <a routerLink="/accueil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
      <a routerLink="/terrains" routerLinkActive="active">Terrains</a>
      <a routerLink="/coordonnees" routerLinkActive="active">Coordonnées</a>
      <a routerLink="/utilisateurs" routerLinkActive="active">Utilisateurs</a>
      <a routerLink="/map" routerLinkActive="active">Carte</a>
      <a routerLink="/login" class="logout">Se déconnecter</a>
    </nav>
  </div>
</header>

<div class="map-container">
  <div *ngIf="loading" class="loading">Loading map and coordinates...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  
  <div id="map"></div>
  
  <div class="map-controls">
    <button (click)="fitBounds()" [disabled]="coordinates.length === 0">
      Fit All Markers
    </button>
  </div>
  
  <div class="coordinates-info">
    <h3>Coordinates ({{ coordinates.length }})</h3>
    <ul *ngIf="coordinates.length > 0; else noCoords">
      <li *ngFor="let coord of coordinates">
        Lat: {{ coord.latitude }}, Lng: {{ coord.longitude }}
      </li>
    </ul>
    <ng-template #noCoords>
      <p>No coordinates available</p>
    </ng-template>
  </div>
</div>
