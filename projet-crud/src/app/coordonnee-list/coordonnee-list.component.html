<div class="table-container">
  <div class="list-header-row">
    <h2>Liste des Coordonnées</h2>
    <button *ngIf="isAdmin$ | async" class="btn-primary" (click)="onAddClick()">+ Ajouter une Coordonnée</button>
  </div>

  <p *ngIf="loading" class="loading">Chargement des coordonnées...</p>

  <p *ngIf="error" class="error">{{ error }}</p>

  <p *ngIf="!loading && coordonnees.length === 0 && !error" class="no-data">Aucune coordonnée trouvée</p>

  <table *ngIf="!loading && coordonnees.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th *ngIf="isAdmin$ | async">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let coordonnee of coordonnees">
        <td>{{ coordonnee.id }}</td>
        <td>{{ coordonnee.latitude }}</td>
        <td>{{ coordonnee.longitude }}</td>
        <td *ngIf="isAdmin$ | async" class="actions-cell">
          <button class="btn-sm btn-secondary" (click)="onEditClick(coordonnee)">Modifier</button>
          <button class="btn-sm btn-danger" (click)="deleteCoordonnee(coordonnee.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
