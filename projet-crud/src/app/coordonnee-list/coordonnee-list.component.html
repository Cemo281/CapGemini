<div class="table-container">
  <h2>Liste des Coordonnées</h2>

  <p *ngIf="loading" class="loading">Chargement des coordonnées...</p>

  <p *ngIf="error" class="error">{{ error }}</p>

  <p *ngIf="!loading && coordonnees.length === 0 && !error" class="no-data">Aucune coordonnée trouvée</p>


  <table *ngIf="!loading && coordonnees.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let coordonnee of coordonnees">
          <td>{{ coordonnee.id }}</td>

          <td *ngIf="editingId !== coordonnee.id">{{ coordonnee.latitude }}</td>
          <td *ngIf="editingId === coordonnee.id"><input [(ngModel)]="editing!.latitude" name="lat-{{ coordonnee.id }}" /></td>

          <td *ngIf="editingId !== coordonnee.id">{{ coordonnee.longitude }}</td>
          <td *ngIf="editingId === coordonnee.id"><input [(ngModel)]="editing!.longitude" name="long-{{ coordonnee.id }}" /></td>

          <td>
            <button *ngIf="auth.isAdmin() && editingId !== coordonnee.id" class="edit-btn" (click)="startEdit(coordonnee)">Modifier</button>
            <button *ngIf="auth.isAdmin() && editingId === coordonnee.id" class="save-btn" (click)="saveEdit(coordonnee.id)">Enregistrer</button>
            <button *ngIf="auth.isAdmin() && editingId === coordonnee.id" class="cancel-btn" (click)="cancelEdit()">Annuler</button>
            <button *ngIf="auth.isAdmin()" class="delete-btn" (click)="deleteCoordonnee(coordonnee.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>    
</div>
