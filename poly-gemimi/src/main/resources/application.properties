spring.application.name=poly-gemimi

spring.datasource.url=jdbc:mariadb://localhost:3300/capgemini
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT properties for authentication
jwt.secret=your-very-long-secret-key-that-is-at-least-256-bits-for-hs256-algorithm-change-this-in-production-please-make-it-random
jwt.expirationMs=3600000

